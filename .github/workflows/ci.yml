name: CI

on:
  push:
    branches: [ "main", "antigravity/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f ids_project/requirements.txt ]; then pip install -r ids_project/requirements.txt; fi
        # The suite is pytest-based; unittest discovery cannot collect it.
        # `pytest` is a test-only dependency (see ids_project/requirements-dev.txt).
        # Selenium is intentionally NOT installed here: the browser acceptance
        # test skips itself when Selenium or Chrome is unavailable, and running a
        # real browser in CI is covered separately from the deterministic suite.
        python -m pip install pytest

    - name: Run unit test suite
      run: |
        python -m pytest ids_project/tests -q

    - name: Run automated evaluation runner
      run: |
        python ids_project/evaluation/run_eval.py
