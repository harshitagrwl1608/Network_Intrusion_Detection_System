name: CI

on:
  push:
    branches: [ "main", "antigravity/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f ids_project/requirements.txt ]; then pip install -r ids_project/requirements.txt; fi

    - name: Run unit test suite
      run: |
        python -m unittest discover ids_project/tests

    - name: Run automated evaluation runner
      run: |
        python ids_project/evaluation/run_eval.py
